# Rebuilds the public feed every 30 minutes and publishes it to GitHub Pages.
# Repo settings: Pages → Source "GitHub Actions". Optional secret: YT_API_KEY (YouTube Data API v3, better charts).
name: feed
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pipx install yt-dlp
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -- public
        env: { YT_API_KEY: "${{ secrets.YT_API_KEY }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
